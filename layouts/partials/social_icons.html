{{- /* PaperMod's social_icons.html, plus the travel globe as the row's last link (landing page only). */ -}}
<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{ partial "svg.html" . }}
    </a>
    {{- end }}
    {{- if fileExists "static/travel/mini/points.json" }}
    <a class="travel-globe" href="/travel/" aria-label="Travel: every place I have been" title="Travel">
        <canvas aria-hidden="true"></canvas>
    </a>
    {{- end }}
</div>
