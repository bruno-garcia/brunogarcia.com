{{- with .cxt}} {{/* Apply proper context from dict */}}
{{- if (and .Params.cover.image (not $.isHidden)) }}
<figure class="entry-cover{{ if .Params.cover.small }} cover-small{{ end }}">
    {{- $loading := cond $.IsSingle "eager" "lazy" }}
    {{- $addLink := (and site.Params.cover.linkFullImages $.IsSingle) }}
    {{- $prod := (hugo.IsProduction | or (eq site.Params.env "production")) }}
    {{- $alt := (.Params.cover.alt | default .Params.cover.caption | plainify) }}
    {{- $responsiveImages := (.Params.cover.responsiveImages | default site.Params.cover.responsiveImages) | default true }}

    {{- $sizes := (slice "360" "480" "720" "1080" "1500") }}
    {{- $processableFormats := (slice "jpg" "jpeg" "png" "tif" "bmp" "gif") -}}
    {{- if hugo.IsExtended -}}
        {{- $processableFormats = $processableFormats | append "webp" -}}
    {{- end -}}

    {{- /* Theme-aware cover: if imageDark is set, render both with CSS toggle */}}
    {{- if .Params.cover.imageDark }}

        {{- $lightCover := (.Resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
        {{- $darkCover := (.Resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.imageDark)) }}

        {{- if $addLink }}
            <a href="{{ (or $lightCover $darkCover).Permalink }}" target="_blank" rel="noopener noreferrer">
        {{- end }}

        {{- /* In production each is served as WebP, at most 1500px wide. */}}
        {{- if $lightCover }}
            {{- $light := $lightCover }}
            {{- if $prod }}{{ $light = $lightCover.Resize (printf "%dx webp" (cond (gt $lightCover.Width 1500) 1500 $lightCover.Width)) }}{{ end }}
            <img class="img-light" loading="{{ $loading }}" src="{{ $light.Permalink }}" alt="{{ $alt }}"
                 width="{{ $light.Width }}" height="{{ $light.Height }}">
        {{- end }}
        {{- if $darkCover }}
            {{- $dark := $darkCover }}
            {{- if $prod }}{{ $dark = $darkCover.Resize (printf "%dx webp" (cond (gt $darkCover.Width 1500) 1500 $darkCover.Width)) }}{{ end }}
            <img class="img-dark" loading="{{ $loading }}" src="{{ $dark.Permalink }}" alt="{{ $alt }}"
                 width="{{ $dark.Width }}" height="{{ $dark.Height }}">
        {{- end }}

        {{- if $addLink }}
            </a>
        {{- end -}}

    {{- else }}
        {{- /* Original PaperMod cover logic for single-image covers */}}
        {{- $pageBundleCover := (.Resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
        {{- $globalResourcesCover := (resources.ByType "image").GetMatch (printf "*%s*" (.Params.cover.image)) }}
        {{- $cover := (or $pageBundleCover $globalResourcesCover)}}

        {{- $imgdl := (.Params.cover.image) | absURL }}
        {{- if $cover -}}
            {{- $imgdl = $cover.Permalink }}
        {{- end -}}

        {{- if $addLink }}
            <a href="{{ $imgdl }}" target="_blank" rel="noopener noreferrer">
        {{- end }}

        {{- if $cover -}}
            {{- if (and (in $processableFormats $cover.MediaType.SubType) ($responsiveImages) (eq $prod true)) }}
                {{- /* Every size as WebP, none wider than 1500px: a photo saved as PNG would otherwise ship as
                       megabytes on the home page. An animated GIF stays animated (and heavy), so give such a post
                       a still cover image and keep the GIF in the post itself. */}}
                {{- $max := cond (gt $cover.Width 1500) 1500 $cover.Width }}
                {{- $srcset := slice }}
                {{- range $size := $sizes }}
                    {{- if le (int $size) $max }}
                        {{- $srcset = $srcset | append (printf "%s %sw" ($cover.Resize (printf "%sx webp" $size)).Permalink $size) }}
                    {{- end }}
                {{- end }}
                {{- if not (in $sizes (string $max)) }}
                    {{- $srcset = $srcset | append (printf "%s %dw" ($cover.Resize (printf "%dx webp" $max)).Permalink $max) }}
                {{- end }}
                {{- $src := $cover.Resize (printf "%dx webp" (cond (gt $max 720) 720 $max)) }}
                <img loading="{{$loading}}"
                    srcset="{{ delimit $srcset ", " }}"
                    src="{{ $src.Permalink }}"
                    sizes="(min-width: 768px) 720px, 100vw"
                    width="{{ $cover.Width }}" height="{{ $cover.Height }}"
                    alt="{{ $alt }}">
            {{- else }}
                <img loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}">
            {{- end }}
        {{- else }}
            <img loading="{{ $loading }}" src="{{ $imgdl }}" alt="{{ $alt }}">
        {{- end }}

        {{- if $addLink }}
            </a>
        {{- end -}}
    {{- end }}

    {{- if $.IsSingle }}
        {{ with .Params.cover.caption -}}
            <figcaption>{{ . | markdownify }}</figcaption>
        {{- end }}
    {{- end }}
</figure>
{{- end }}
{{- end -}}
