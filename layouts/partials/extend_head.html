<!-- Custom styles -->
{{- $custom := resources.Get "css/custom.css" | minify | fingerprint -}}
<link
    href="{{ $custom.Permalink }}"
    integrity="{{ $custom.Data.Integrity }}"
    rel="preload stylesheet" as="style">

<!-- Sentry loads async so it never holds up the page; it initializes as soon as the bundle arrives. -->
<script>
function initSentry() {
  Sentry.init({
    dsn: "https://88e8d79d263e44f0b6e3c3745244ce9c@o117736.ingest.sentry.io/5778766",
    // Local previews (hugo server) report as development, so they stay out of the site's numbers.
    environment: location.hostname === "brunogarcia.com" ? "production" : "development",
    integrations: [Sentry.browserTracingIntegration()],
    tracesSampleRate: 1.0,
  });
}
</script>
<script
    async
    src="https://browser.sentry-cdn.com/10.39.0/bundle.tracing.min.js"
    crossorigin="anonymous"
    onload="initSentry()"
></script>
